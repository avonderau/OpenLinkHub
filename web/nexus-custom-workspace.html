{{ define "nexus-custom-workspace" }}
            <!-- Nexus device controls beside the integrated screen editor -->
            <div class="nexus-workspace">
                <div class="nexus-device-column">
                    <div class="card system-card text-center">
                        <div class="card-header">
                            {{ .Device.Product }}
                        </div>
                        <div class="card-body">
                            <div class="settings-list">
                                <!-- Firmware -->
                                <div class="settings-row">
                                    <span class="settings-label text-ellipsis">{{ .Lang "txtFirmware" }}</span>
                                    <span class="meta-value">{{ .Device.Firmware }}</span>
                                </div>

                                <div class="settings-row nexus-cycle-settings">
                                    <label for="cyclingMode">Screen cycling</label>
                                    <select id="cyclingMode" class="form-select system-select">
                                        <option value="manual">Manual (touch edges)</option>
                                        <option value="automatic">Automatic</option>
                                        <option value="off">Off (fixed screen)</option>
                                    </select>
                                    <label for="cyclingSeconds">Interval</label>
                                    <select id="cyclingSeconds" class="form-select system-select">
                                        <option value="5">5 seconds</option>
                                        <option value="10">10 seconds</option>
                                        <option value="15" selected>15 seconds</option>
                                        <option value="30">30 seconds</option>
                                        <option value="60">1 minute</option>
                                        <option value="120">2 minutes</option>
                                        <option value="300">5 minutes</option>
                                        <option value="600">10 minutes</option>
                                        <option value="1800">30 minutes</option>
                                        <option value="3600">1 hour</option>
                                    </select>
                                    <small>Save layout to apply cycling settings.</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="nexus-editor-column">
                    <section id="nexus-editor" class="card system-card"><div class="card-body">

<div class="nexus-editor-heading"><button id="save" type="button">Save Layout</button></div>
<p id="message" role="status" aria-live="polite"></p>
<div class="nexus-screen-actions"><label>Screen <select id="screens"></select></label><button id="addScreen">Add screen</button><button id="renameScreen">Rename</button><button id="duplicateScreen">Duplicate screen</button><button id="deleteScreen">Delete screen</button></div>
<div id="preview"><div id="screen"></div></div>
<fieldset class="nexus-panel" id="nexus-add-panel"><legend>Add Widgets</legend>
<p class="nexus-panel-description">Choose a widget to add to the selected screen.</p>
<div class="nexus-create-actions"><button id="addMetric">Add metric</button><button id="addText">Add text</button><button id="addBar">Add bar</button><button id="addButton">Add button</button></div>
</fieldset>
<fieldset class="nexus-panel" id="nexus-selected-panel"><legend>Selected Widget</legend>
<div id="selectedWidgetStatus" class="nexus-panel-description">Select a widget in the preview to edit it.</div>
<div id="properties"></div>
<div class="nexus-widget-actions"><button id="duplicateWidget" disabled>Duplicate widget</button><button id="deleteWidget" disabled>Remove selected widget</button></div>
</fieldset>
<fieldset class="nexus-panel"><legend>Background</legend><label>Background ID <input id="background" placeholder="e.g. mountains"></label>
<label>Upload PNG/JPEG <input type="file" id="image" accept="image/png,image/jpeg"></label><button id="upload">Upload and apply</button></fieldset>


</div></section>
                </div>
            </div>
{{ end }}
