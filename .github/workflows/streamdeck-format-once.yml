name: Temporary Stream Deck Go formatting
on:
  push:
    branches: [feature/streamdeck-icon-pack-import]
    paths:
      - '.github/workflows/streamdeck-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed Go files
        run: |
          gofmt -w src/server/icon_sets_api.go src/server/streamdeck_icon_pack.go src/server/streamdeck_icon_pack_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/server/icon_sets_api.go src/server/streamdeck_icon_pack.go src/server/streamdeck_icon_pack_test.go
            git commit -m "style: gofmt Stream Deck importer"
            git push
          fi
