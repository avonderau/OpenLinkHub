name: Nexus editor UI tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'static/js/nexus-*.js'
      - 'static/js/overview.js'
      - 'static/js/overview-dom-safety.test.cjs'
      - 'static/js/nexus-*.test.cjs'
      - 'static/css/nexus-*.css'
      - 'static/nexus-editor.html'
      - 'web/nexus*.html'
      - 'web/sidebar.html'
      - 'web/head.html'
      - 'static/js/sidebar.js'
      - 'static/css/openlinkhub-nexus-design.css'
      - 'static/css/openlinkhub-settings.css'
      - 'static/js/settings-sections.js'
      - 'static/js/settings-sections.test.cjs'
      - 'static/js/settings-dashboard.test.cjs'
      - 'static/js/settings.js'
      - 'web/settings.html'
      - 'static/css/openlinkhub-telemetry.css'
      - 'static/js/temperature-bar.js'
      - 'static/js/temperature-bar.test.cjs'
      - 'web/temperature-bar.html'
      - 'web/login.html'
      - '.github/workflows/nexus-editor-ui-tests.yml'
  push:
    branches: [main]
    paths:
      - 'static/js/nexus-*.js'
      - 'static/js/overview.js'
      - 'static/js/overview-dom-safety.test.cjs'
      - 'static/js/nexus-*.test.cjs'
      - 'static/css/nexus-*.css'
      - 'static/nexus-editor.html'
      - 'web/nexus*.html'
      - 'web/sidebar.html'
      - 'web/head.html'
      - 'static/js/sidebar.js'
      - 'static/css/openlinkhub-nexus-design.css'
      - 'static/css/openlinkhub-settings.css'
      - 'static/js/settings-sections.js'
      - 'static/js/settings-sections.test.cjs'
      - 'static/js/settings-dashboard.test.cjs'
      - 'static/js/settings.js'
      - 'web/settings.html'
      - 'static/css/openlinkhub-telemetry.css'
      - 'static/js/temperature-bar.js'
      - 'static/js/temperature-bar.test.cjs'
      - 'web/temperature-bar.html'
      - 'web/login.html'
      - '.github/workflows/nexus-editor-ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check static/js/nexus-editor.js
          node --check static/js/overview.js
          node --check static/js/nexus-layout-files.js
          node --check static/js/nexus-widget-library.js
          node --check static/js/sidebar.js
          node --check static/js/settings-sections.js
          node --check static/js/settings.js
          node --check static/js/temperature-bar.js
      - name: Run Nexus UI regression suite
        run: |
          node --test static/js/overview-dom-safety.test.cjs static/js/nexus-editor-workflow.test.cjs static/js/nexus-layout-files.test.cjs static/js/nexus-starter-templates.test.cjs static/js/nexus-widget-library.test.cjs static/js/temperature-bar.test.cjs static/js/settings-sections.test.cjs static/js/settings-dashboard.test.cjs static/js/nexus-visual-unification.test.cjs
