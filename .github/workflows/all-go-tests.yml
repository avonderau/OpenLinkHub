name: All Go tests
# Runs every package's unit tests. The area-specific workflows only cover
# Nexus, Deck, server and a few others, which let failures in packages such
# as src/temperatures go unnoticed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install HID and audio development libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libpipewire-0.3-dev pkg-config
      - name: Test all packages
        env:
          CGO_CFLAGS_ALLOW: -fno-strict-overflow
        run: go test ./... -count=1
