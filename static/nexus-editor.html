<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus screen editor</title>
<style>
body{font:15px system-ui,sans-serif;background:#101821;color:#e8eff5;margin:2rem auto;max-width:1050px;padding:0 1rem}
button,input,select{font:inherit;padding:.45rem;margin:.2rem;background:#233748;color:white;border:1px solid #617c90;border-radius:5px}
button{cursor:pointer}button:hover{background:#31546a}label{display:inline-block;margin:.4rem}
#screen{position:relative;width:640px;height:48px;background:#182b38;overflow:hidden;border:2px solid #82abc0;touch-action:none}
.widget{position:absolute;box-sizing:border-box;background:#2b4558db;border:1px solid #80bdd9;cursor:move;overflow:hidden;font-size:11px;padding:3px;user-select:none}
.widget.selected{outline:2px solid #ffc36a}
#preview{overflow:auto;padding:1rem;background:#080f16}
#message{min-height:1.5em}fieldset{border:1px solid #496275;margin:1rem 0}input[type=number]{width:65px}
.nexus-create-actions{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem}.nexus-panel-description{color:#a7bac7;margin:.3rem 0 .7rem}#deleteWidget:disabled{opacity:.45;cursor:not-allowed}#properties{display:flex;flex-wrap:wrap;gap:.25rem;margin-bottom:.75rem}
.nexus-editor-heading{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}.nexus-editor-heading h1{margin:.3rem 0}.nexus-editor-heading #save{font-weight:600}
</style></head><body>
<div class="nexus-editor-heading"><h1>iCUE NEXUS screen editor</h1><button id="save" type="button">Save Layout</button></div>
<p>Experimental editor · 640 × 48 pixels · Select a device, drag widgets to position them, and save.</p><p id="message" role="status" aria-live="polite"></p>
<label>Device <select id="device"></select></label><button id="load">Load</button>
<label>Screen <select id="screens"></select></label><button id="addScreen">Add screen</button><button id="deleteScreen">Delete screen</button>
<div id="preview"><div id="screen"></div></div>
<fieldset id="nexus-add-panel"><legend>Add Widgets</legend>
<p class="nexus-panel-description">Choose a widget to add to the selected screen.</p>
<div class="nexus-create-actions"><button id="addMetric">Add metric</button><button id="addText">Add text</button><button id="addBar">Add bar</button><button id="addButton">Add button</button><button id="addMacro">Add macro</button></div>
</fieldset>
<fieldset id="nexus-selected-panel"><legend>Selected Widget</legend>
<p id="selectedWidgetStatus" class="nexus-panel-description" role="status">Select a widget in the preview to edit it.</p>
<div id="properties"></div>
<button id="deleteWidget" disabled>Remove selected widget</button>
</fieldset>
<fieldset><legend>Background</legend><label>Background ID <input id="background" placeholder="e.g. mountains"></label>
<label>Upload PNG/JPEG <input type="file" id="image" accept="image/png,image/jpeg"></label><button id="upload">Upload and apply</button></fieldset>

<script src="/static/js/nexus-editor.js"></script></body></html>
